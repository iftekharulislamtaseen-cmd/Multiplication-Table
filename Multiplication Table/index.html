<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body class= "bg-gray-300">

    <div class="bg-white p-30 rounded-2xl w-350 mt-20 mx-auto mb-20">
        <div >
            <h3 class="text-[18px] font-medium pb-20">Multiplication Table</h3>
            <span class="text-[16px] block pb-10">Choose a Number</span>
        </div>
        <div class="border border-blue-500 py-10 px-20 rounded-3xl mb-10"><input class="outline-0 border-0 w-250" type="number" name="" id="input"></div>
        <div class="pb-10">
            <div class="" id="result"></div>
        </div>
        <div>
            <button class="bg-blue-500 py-5 px-20 rounded-full text-[18px] text-white" id="submit">Submit</button>
        </div>
    </div>
    
    <script>
        const input = document.getElementById("input");
        const result = document.getElementById("result");
        const submit = document.getElementById("submit");


        submit.addEventListener('click',function(){

            result.innerHTML ="";

            let values = input.value

            for(let i = 1; i<=10; i++){
            result.innerHTML += `<div class="bg-[#DFFFDF] pl-20 pr-150 py-10 text-[18px] rounded-2xl mb-10">${input.value} x ${i} = ${input.value*i}</div>`;
        }

        })
        
        

        
    </script>
</body>
</html>
